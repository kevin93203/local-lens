[package]
name = "local-lens"
version = "0.1.0"
description = "Private local image search"
authors = ["you"]
edition = "2021"

[lib]
name = "local_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-opener = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
base64 = "0.22"
fastembed = { path = "../vendor/fastembed-patched" }
hf-hub = "=0.4.3"
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["ndarray", "download-binaries"] }
ndarray = "=0.16.1"
imageproc = "=0.27.0"
nalgebra = "=0.35.0"
# Keep the dependency graph compatible with the Rust 1.82 toolchain used by
# the project.  Newer `time` releases use the Rust 2024 edition (Cargo 1.85+).
# This can be removed after upgrading the Rust toolchain.
time = "=0.3.36"

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["ndarray", "download-binaries", "directml"] }
