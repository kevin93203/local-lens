[package]
name = "local-lens"
version = "0.1.0"
description = "Private local image search"
authors = ["you"]
edition = "2021"

[lib]
name = "local_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-opener = "2.0.0"
serde = { version = "1", features = ["derive"] }
walkdir = "2.5"
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
base64 = "0.22"
fastembed = "=4.9.1"
# Keep the dependency graph compatible with the Rust 1.82 toolchain used by
# the project.  Newer `time` releases use the Rust 2024 edition (Cargo 1.85+).
# This can be removed after upgrading the Rust toolchain.
time = "=0.3.36"
